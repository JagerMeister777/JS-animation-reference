<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Neon Particles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
        }

        canvas {
            display: block;
        }

        .ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            color: #ffffff;
            font-size: 3rem;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff;
            letter-spacing: 4px;
            animation: pulse 2s infinite alternate;
        }

        p {
            color: #888;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        @keyframes pulse {
            0% { opacity: 0.7; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <div class="ui">
        <h1>TOUCH THE MAGIC</h1>
        <p>カーソルを動かすか、画面をクリック／タップしてください</p>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const particles = [];
        const mouse = { x: width / 2, y: height / 2, active: false };

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Particle {
            constructor(x, y) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.size = Math.random() * 4 + 1;
                this.speedX = (Math.random() - 0.5) * 3;
                this.speedY = (Math.random() - 0.5) * 3;
                this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                this.life = 1;
                this.decay = Math.random() * 0.01 + 0.005;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // マウスとの引き寄せインタラクション
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 150) {
                    const angle = Math.atan2(dy, dx);
                    const force = (150 - distance) / 150;
                    this.speedX += Math.cos(angle) * force * 0.2;
                    this.speedY += Math.sin(angle) * force * 0.2;
                }

                // 画面端での跳ね返り
                if (this.x < 0 || this.x > width) this.speedX *= -1;
                if (this.y < 0 || this.y > height) this.speedY *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
            }
        }

        // 初期粒子を生成
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }

        // イベン listeners
        const createBurst = (x, y) => {
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(x, y));
            }
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            createBurst(e.clientX, e.clientY);
        });

        window.addEventListener('click', (e) => {
            for (let i = 0; i < 30; i++) {
                particles.push(new Particle(e.clientX, e.clientY));
            }
        });

        window.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            createBurst(mouse.x, mouse.y);
        });

        // アニメーションループ
        function animate() {
            // 残像効果を出すための半透明黒グラデーション
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, width, height);

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();

                // パーティクル数が多すぎる場合は古いものを削除
                if (particles.length > 300) {
                    particles.shift();
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
